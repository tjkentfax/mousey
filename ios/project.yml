name: Mousey
options:
  bundleIdPrefix: com.mousey
  deploymentTarget:
    iOS: "17.0"
targets:
  Mousey:
    type: application
    platform: iOS
    sources:
      - path: Mousey
    info:
      path: Mousey/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mousey.remote
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: Mousey/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
