<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#08090d">
<title>Mousey</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);gap:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 4px}.brand{font-size:24px;font-weight:800}.status{font-size:12px;padding:7px 10px;border-radius:999px;background:#242631;color:#aaa}.status.on{background:#12351f;color:#6ee79a}.setup{margin:auto;width:min(440px,100%);background:#11131a;border:1px solid #292c38;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.setup h1{margin:0 0 8px;font-size:30px}.setup p{color:#9da2b2;line-height:1.5}.setup input{width:100%;padding:15px;margin:7px 0;background:#08090d;color:white;border:1px solid #343846;border-radius:12px;font-size:16px}.setup button{width:100%;padding:15px;border:0;border-radius:12px;background:#fff;color:#08090d;font-weight:800;font-size:16px;margin-top:10px}.pad{position:relative;flex:1;min-height:0;border:1px solid #292c38;border-radius:24px;background:#101219;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}.pad:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#292c38;opacity:.45;pointer-events:none}.zone{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px;pointer-events:none}.zone.left{left:0}.zone.right{right:0}.zone strong{font-size:13px;opacity:.55}.hint{text-align:center;color:#707687;font-size:11px;padding:2px}.settings{position:absolute;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid #303442;background:#171a22;color:#fff;z-index:5}.hidden{display:none!important}</style>
</head><body><div class="app"><header class="top"><div class="brand">Mousey</div><div id="status" class="status">Not connected</div></header>
<section id="setup" class="setup"><h1>Turn your iPhone into a mouse.</h1><p>Use the screen like a laptop trackpad. Move one finger to move the PC cursor. Tap the left or right side to click.</p><input id="host" placeholder="PC address, e.g. 192.168.1.20:8765" autocomplete="off"><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="off"><button id="connect">Connect</button></section>
<main id="pad" class="pad hidden"><div class="zone left"><strong>LEFT CLICK</strong></div><div class="zone right"><strong>RIGHT CLICK</strong></div></main><div id="hint" class="hint hidden">One finger = move · two fingers = scroll · tap left/right to click · hold + move = drag</div><button id="calibrate" class="settings hidden" aria-label="Center cursor">⌖</button></div>
<script>
const $=s=>document.querySelector(s);let base='',pin='',connected=false;let active=new Map();let moved=false;let startX=0,startY=0;let lastX=0,lastY=0;let pendingDx=0,pendingDy=0;let lastSend=0;let dragButton=null;let twoFinger=false;let lastTwoY=0;
function normalizeHost(v){let h=v.trim();if(!h)throw Error('enter the PC address');if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(h))h='https://'+h;let u;try{u=new URL(h)}catch(_){throw Error('invalid PC address')}if(u.protocol!=='http:'&&u.protocol!=='https:')throw Error('use http:// or https://');u.username='';u.password='';u.hash='';return u.origin+u.pathname.replace(/\/$/,'')}
function endpoint(){return base+'/mouse'}async function send(action,button,extra={}){if(!base)return;const r=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,action,button,...extra})});if(!r.ok)throw Error('server '+r.status);return r}
function setStatus(t,on){const s=$('#status');s.textContent=t;s.classList.toggle('on',on)}
async function connect(){try{base=normalizeHost($('#host').value);pin=$('#pin').value.trim();setStatus('Connecting...',true);await send('ping');connected=true;$('#setup').classList.add('hidden');$('#pad').classList.remove('hidden');$('#hint').classList.remove('hidden');$('#calibrate').classList.remove('hidden');setStatus('Trackpad ready',true)}catch(e){setStatus('Connection failed: '+(e?.message||e),false)}}
function points(){return [...active.values()]}
function pointerDown(e){if(!connected)return;e.preventDefault();active.set(e.pointerId,{x:e.clientX,y:e.clientY});$('#pad').setPointerCapture?.(e.pointerId);if(active.size===1){moved=false;startX=e.clientX;startY=e.clientY;lastX=e.clientX;lastY=e.clientY;dragButton=e.clientX<innerWidth/2?'left':'right';setTimeout(()=>{if(active.has(e.pointerId)&&!moved&&active.size===1){send('down',dragButton).catch(()=>{})}},350)}else if(active.size===2){twoFinger=true;lastTwoY=points().reduce((a,p)=>a+p.y,0)/2}}
function pointerMove(e){if(!connected||!active.has(e.pointerId))return;e.preventDefault();active.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=points();if(p.length>=2){if(!twoFinger){twoFinger=true;lastTwoY=p.reduce((a,q)=>a+q.y,0)/p.length;pendingDx=0;pendingDy=0}const y=p.reduce((a,q)=>a+q.y,0)/p.length;const dy=y-lastTwoY;lastTwoY=y;pendingDy+=-dy*1.7;flush(true);return}if(twoFinger)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>6)moved=true;pendingDx+=dx*1.55;pendingDy+=dy*1.55;flush(false)}
function flush(force){const now=performance.now();if(!force&&now-lastSend<8)return;if(Math.abs(pendingDx)+Math.abs(pendingDy)<.15)return;lastSend=now;const dx=Math.max(-80,Math.min(80,pendingDx)),dy=Math.max(-80,Math.min(80,pendingDy));pendingDx-=dx;pendingDy-=dy;send('move',null,{dx,dy}).catch(()=>setStatus('Connection lost',false))}
setInterval(()=>flush(false),8);
function pointerUp(e){if(!connected)return;e.preventDefault();active.delete(e.pointerId);if(active.size===0){if(!moved&& !twoFinger){send('click',dragButton).catch(()=>{})}else if(!moved&&twoFinger){} if(dragButton&&moved)send('up',dragButton).catch(()=>{});moved=false;dragButton=null;twoFinger=false;pendingDx=0;pendingDy=0}else if(active.size===1){twoFinger=true}}
function pointerCancel(e){active.delete(e.pointerId);if(active.size===0){if(dragButton)send('up',dragButton).catch(()=>{});dragButton=null;moved=false;twoFinger=false;pendingDx=0;pendingDy=0}}
const pad=$('#pad');pad.addEventListener('pointerdown',pointerDown);pad.addEventListener('pointermove',pointerMove);pad.addEventListener('pointerup',pointerUp);pad.addEventListener('pointercancel',pointerCancel);$('#connect').onclick=connect;$('#calibrate').onclick=()=>send('center').catch(()=>{});
</script></body></html>
