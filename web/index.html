<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08090d">
<title>Mousey</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);gap:10px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px}.brand{font-size:24px;font-weight:800}.status{font-size:12px;padding:7px 10px;border-radius:999px;background:#242631;color:#aaa}.status.on{background:#12351f;color:#6ee79a}.setup{margin:auto;width:min(440px,100%);background:#11131a;border:1px solid #292c38;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.setup h1{margin:0 0 8px;font-size:30px}.setup p{color:#9da2b2;line-height:1.5}.setup input{width:100%;padding:15px;margin:7px 0;background:#08090d;color:white;border:1px solid #343846;border-radius:12px;font-size:16px}.setup button{width:100%;padding:15px;border:0;border-radius:12px;background:#fff;color:#08090d;font-weight:800;font-size:16px;margin-top:10px}.pad{flex:1;min-height:0;display:grid;grid-template-columns:25% 50% 25%;gap:7px}.zone{border:1px solid #292c38;border-radius:24px;background:#101219;display:flex;align-items:center;justify-content:center;flex-direction:column;user-select:none;-webkit-user-select:none}.zone:active{background:#171a24}.zone strong{font-size:16px}.zone span{margin-top:8px;color:#858b9c;font-size:11px;text-align:center}.aim{touch-action:none}.aim strong{font-size:21px}.hint{text-align:center;color:#707687;font-size:11px;padding:2px}.settings{position:absolute;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid #303442;background:#171a22;color:#fff}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Mousey</div><div id="status" class="status">Not connected</div></header>
<section id="setup" class="setup"><h1>Turn your iPhone into a mouse.</h1><p>Use the middle of the screen to aim and move. The left and right sides are mouse buttons.</p><input id="host" placeholder="PC address, e.g. 192.168.1.20:8765" autocomplete="off"><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="off"><button id="connect">Connect</button></section>
<main id="pad" class="pad hidden">
<div id="left" class="zone"><strong>LEFT CLICK</strong><span>Tap · hold</span></div>
<div id="aim" class="zone aim"><strong>AIM &amp; MOVE</strong><span>Slide one finger<br>Two fingers = scroll</span></div>
<div id="right" class="zone"><strong>RIGHT CLICK</strong><span>Tap · hold</span></div>
</main>
<div id="hint" class="hint hidden">LEFT CLICK · AIM &amp; MOVE · RIGHT CLICK</div>
<button id="calibrate" class="settings hidden" aria-label="Center cursor">⌖</button>
</div>
<script>
const $=s=>document.querySelector(s);let base='',pin='',connected=false;let active=new Map(),lastX=0,lastY=0,lastSend=0,pendingDx=0,pendingDy=0;let multi=false,scrollY=0;
function normalizeHost(v){let h=v.trim();if(!h)throw Error('enter the PC address');if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(h))h='https://'+h;let u;try{u=new URL(h)}catch(_){throw Error('invalid PC address')}if(u.protocol!=='http:'&&u.protocol!=='https:')throw Error('use http:// or https://');u.username='';u.password='';u.hash='';return u.origin+u.pathname.replace(/\/$/,'')}
function endpoint(){return base+'/mouse'}
async function send(action,button,extra={}){if(!base)return;const r=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,action,button,...extra})});if(!r.ok)throw Error('server '+r.status);return r}
function setStatus(t,on){const s=$('#status');s.textContent=t;s.classList.toggle('on',on)}
async function connect(){try{base=normalizeHost($('#host').value);pin=$('#pin').value.trim();setStatus('Connecting...',true);await send('ping');connected=true;$('#setup').classList.add('hidden');$('#pad').classList.remove('hidden');$('#hint').classList.remove('hidden');$('#calibrate').classList.remove('hidden');setStatus('Mouse ready',true)}catch(e){setStatus('Connection failed: '+(e?.message||e),false)}}
function flush(){const now=performance.now();if(now-lastSend<8)return;if(Math.abs(pendingDx)+Math.abs(pendingDy)<.15)return;const dx=Math.max(-80,Math.min(80,pendingDx)),dy=Math.max(-80,Math.min(80,pendingDy));pendingDx-=dx;pendingDy-=dy;lastSend=now;send('move',null,{dx,dy}).catch(()=>setStatus('Connection lost',false))}
setInterval(flush,8);
const aim=$('#aim');
aim.addEventListener('pointerdown',e=>{if(!connected)return;e.preventDefault();aim.setPointerCapture(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===1){multi=false;lastX=e.clientX;lastY=e.clientY}else{multi=true;const p=[...active.values()];scrollY=p.reduce((a,q)=>a+q.y,0)/p.length}});
aim.addEventListener('pointermove',e=>{if(!connected||!active.has(e.pointerId))return;e.preventDefault();active.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...active.values()];if(p.length>=2){multi=true;const y=p.reduce((a,q)=>a+q.y,0)/p.length;const dy=y-scrollY;scrollY=y;if(Math.abs(dy)>1)send('scroll',null,{dy:-dy*.08}).catch(()=>setStatus('Connection lost',false));return}if(multi)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;pendingDx+=dx*2.2;pendingDy+=dy*2.2;flush()});
function aimUp(e){active.delete(e.pointerId);if(active.size===0){multi=false;pendingDx=0;pendingDy=0}else if(active.size===1){const p=[...active.values()][0];lastX=p.x;lastY=p.y}}aim.addEventListener('pointerup',aimUp);aim.addEventListener('pointercancel',aimUp);
function clickZone(el,button){let timer=null,held=false,moved=false;el.addEventListener('pointerdown',e=>{if(!connected)return;e.preventDefault();el.setPointerCapture(e.pointerId);held=false;moved=false;timer=setTimeout(()=>{held=true;send('down',button).catch(()=>{})},350)});el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-e.pointerId)+Math.abs(e.clientY-e.pointerId)>10)moved=true});el.addEventListener('pointerup',e=>{e.preventDefault();if(timer)clearTimeout(timer);if(held)send('up',button).catch(()=>{});else send('click',button).catch(()=>{})});el.addEventListener('pointercancel',()=>{if(timer)clearTimeout(timer);if(held)send('up',button).catch(()=>{});held=false})}
clickZone($('#left'),'left');clickZone($('#right'),'right');$('#connect').onclick=connect;$('#calibrate').onclick=()=>send('center').catch(()=>setStatus('Connection lost',false));
</script>
</body></html>
