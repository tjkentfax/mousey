<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#08090d"><title>Mousey</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:none}.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);gap:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 4px}.brand{font-size:24px;font-weight:800}.status{font-size:12px;padding:7px 10px;border-radius:999px;background:#242631;color:#aaa}.status.on{background:#12351f;color:#6ee79a}.setup{margin:auto;width:min(440px,100%);background:#11131a;border:1px solid #292c38;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.setup h1{margin:0 0 8px;font-size:30px}.setup p{color:#9da2b2;line-height:1.5}.setup input{width:100%;padding:15px;margin:7px 0;background:#08090d;color:white;border:1px solid #343846;border-radius:12px;font-size:16px}.setup button{width:100%;padding:15px;border:0;border-radius:12px;background:#fff;color:#08090d;font-weight:800;font-size:16px;margin-top:10px}.pad{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.zone{border:1px solid #292c38;border-radius:24px;background:#101219;display:flex;align-items:center;justify-content:center;flex-direction:column;user-select:none;-webkit-user-select:none}.zone:active{background:#171a24}.zone strong{font-size:20px}.zone span{margin-top:8px;color:#858b9c;font-size:12px}.hint{text-align:center;color:#707687;font-size:11px;padding:2px}.settings{position:absolute;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid #303442;background:#171a22;color:#fff}.hidden{display:none!important}</style></head><body><div class="app"><header class="top"><div class="brand">Mousey</div><div id="status" class="status">Not connected</div></header><section id="setup" class="setup"><h1>Turn your iPhone into a mouse.</h1><p>Run the Mousey desktop receiver on Windows or Linux, then enter the address and PIN it shows.</p><input id="host" placeholder="PC address, e.g. 192.168.1.20:8765" autocomplete="off"><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="off"><button id="connect">Connect</button></section><main id="pad" class="pad hidden"><div class="zone" data-button="left"><strong>LEFT CLICK</strong><span>Tap · hold to drag</span></div><div class="zone" data-button="right"><strong>RIGHT CLICK</strong><span>Tap · hold to drag</span></div></main><div id="hint" class="hint hidden">Slide the phone on the desk like a real mouse · ⌖ recalibrates</div><button id="calibrate" class="settings hidden" aria-label="Calibrate">⌖</button></div><script>
const $=s=>document.querySelector(s);let base='',pin='',drag=null,motionStarted=false;let sensitivity=125;let lastSensorTime=0,lastFlush=0,pendingDx=0,pendingDy=0;let biasX=0,biasY=0,calibrating=false,calibrationSamples=0;let gravityX=0,gravityY=0,gravityZ=0;let velocityX=0,velocityY=0;
function normalizeHost(v){let h=v.trim();if(!h)throw Error('enter the PC address');if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(h))h='https://'+h;let u;try{u=new URL(h)}catch(_){throw Error('invalid PC address')}if(u.protocol!=='http:'&&u.protocol!=='https:')throw Error('use http:// or https://');u.username='';u.password='';u.hash='';return u.origin+u.pathname.replace(/\/$/,'')}
function endpoint(){return base+'/mouse'}async function send(action,button,extra={}){if(!base)throw Error('not connected');const r=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,action,button,...extra})});if(!r.ok)throw Error('server '+r.status);return r}function setStatus(t,on){const s=$('#status');s.textContent=t;s.classList.toggle('on',on)}
async function connect(){try{base=normalizeHost($('#host').value);pin=$('#pin').value.trim();if(!window.isSecureContext){setStatus('Open Mousey over HTTPS',false);return}await requestMotionPermission();setStatus('Checking PC...',true);await send('ping');$('#setup').classList.add('hidden');$('#pad').classList.remove('hidden');$('#hint').classList.remove('hidden');$('#calibrate').classList.remove('hidden');startMotion()}catch(e){setStatus('Connection failed: '+(e?.message||e),false)}}
async function requestMotionPermission(){if(!('DeviceMotionEvent'in window))throw Error('motion API unavailable');if(typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted')throw Error('motion permission '+p)}}
function startMotion(){if(motionStarted)return;motionStarted=true;window.addEventListener('devicemotion',onMotion,true);setStatus('Desk mouse ready',true);setTimeout(calibrate,250)}
function onMotion(e){const t=performance.now();if(!lastSensorTime){lastSensorTime=t;return}const dt=Math.max(.008,Math.min(.04,(t-lastSensorTime)/1000));lastSensorTime=t;
  let ax,ay;
  if(e.acceleration&&e.acceleration.x!=null&&e.acceleration.y!=null){ax=e.acceleration.x;ay=e.acceleration.y}
  else if(e.accelerationIncludingGravity&&e.accelerationIncludingGravity.x!=null){
    const g=e.accelerationIncludingGravity;const k=1-Math.exp(-dt/0.8);gravityX+=k*(g.x-gravityX);gravityY+=k*(g.y-gravityY);gravityZ+=k*(g.z-gravityZ);ax=g.x-gravityX;ay=g.y-gravityY;
  } else return;
  if(calibrating){biasX=(biasX*calibrationSamples+ax)/(calibrationSamples+1);biasY=(biasY*calibrationSamples+ay)/(calibrationSamples+1);calibrationSamples++;velocityX=0;velocityY=0;return}
  ax-=biasX;ay-=biasY;
  // The phone is flat: acceleration is the useful signal for actual sliding. The previous version
  // differentiated acceleration, which produced almost no movement and made the cursor feel stuck.
  const dead=.035; if(Math.abs(ax)<dead)ax=0;if(Math.abs(ay)<dead)ay=0;
  const gain=1+Math.min(2.5,Math.hypot(ax,ay)*1.8);
  velocityX+=(-ax)*dt*gain;velocityY+=(ay)*dt*gain;
  // Friction turns acceleration into a short mouse impulse and quickly settles when the phone stops.
  const friction=Math.pow(.22,dt);velocityX*=friction;velocityY*=friction;
  pendingDx+=velocityX*sensitivity;pendingDy+=velocityY*sensitivity;
}
function flushMove(){const now=performance.now();if(now-lastFlush<12)return;if(Math.abs(pendingDx)+Math.abs(pendingDy)<.08)return;lastFlush=now;const dx=Math.max(-60,Math.min(60,pendingDx)),dy=Math.max(-60,Math.min(60,pendingDy));pendingDx-=dx;pendingDy-=dy;send('move',null,{dx,dy}).catch(()=>setStatus('Connection lost',false))}setInterval(flushMove,12);
function calibrate(){calibrating=true;calibrationSamples=0;biasX=0;biasY=0;gravityX=0;gravityY=0;gravityZ=0;lastSensorTime=0;pendingDx=0;pendingDy=0;velocityX=0;velocityY=0;setStatus('Hold phone still...',true);setTimeout(()=>{calibrating=false;setStatus('Desk mouse ready',true)},700)}
function pointerZone(el){let timer;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);drag={id:e.pointerId,button:el.dataset.button,long:false};timer=setTimeout(()=>{if(drag){drag.long=true;send('down',drag.button).catch(()=>{})}},420)});el.addEventListener('pointerup',e=>{e.preventDefault();clearTimeout(timer);if(!drag)return;if(drag.long)send('up',drag.button).catch(()=>{});else send('click',drag.button).catch(()=>{});drag=null});el.addEventListener('pointercancel',()=>{clearTimeout(timer);if(drag?.long)send('up',drag.button).catch(()=>{});drag=null})}document.querySelectorAll('.zone').forEach(pointerZone);$('#connect').onclick=connect;$('#calibrate').onclick=calibrate;
</script></body></html>
